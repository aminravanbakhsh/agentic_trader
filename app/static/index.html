<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Trader</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0f1b2d;
    --navy-light: #1a2940;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --slate-50: #f8fafc;
    --slate-100: #f1f5f9;
    --slate-200: #e2e8f0;
    --slate-400: #94a3b8;
    --slate-500: #64748b;
    --slate-700: #334155;
    --slate-900: #0f172a;
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--slate-100);
    color: var(--slate-900);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  header svg { flex-shrink: 0; }
  header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
  header span { font-size: 0.8rem; color: var(--slate-400); margin-left: auto; }

  main {
    flex: 1;
    width: 100%;
    max-width: 820px;
    margin: 2rem auto;
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    padding: 1.5rem;
  }

  .form-row {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
    flex-wrap: wrap;
  }

  .field { display: flex; flex-direction: column; gap: 0.35rem; }
  .field label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--slate-500);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field-ticker { width: 120px; flex-shrink: 0; }
  .field-question { flex: 1; min-width: 200px; }

  input, textarea {
    border: 1.5px solid var(--slate-200);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--slate-900);
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--slate-400); }

  textarea { resize: vertical; min-height: 42px; height: 42px; }

  button#submit {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
    height: 42px;
  }
  button#submit:hover:not(:disabled) { background: var(--accent-hover); }
  button#submit:disabled { opacity: 0.55; cursor: not-allowed; }

  .agents-bar {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    min-height: 1.75rem;
    align-items: center;
  }
  .agents-bar:empty { display: none; }

  .agent-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    animation: fadeIn 0.25s ease;
  }

  .agent-pill.working {
    background: #eff6ff;
    color: var(--accent);
    border: 1px solid #bfdbfe;
  }
  .agent-pill.working::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite;
  }

  .agent-pill.done {
    background: #f0fdf4;
    color: var(--green);
    border: 1px solid #bbf7d0;
  }
  .agent-pill.done::before {
    content: "✓";
    font-size: 0.7rem;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #result {
    display: none;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 0.95rem;
    color: var(--slate-700);
  }
  #result h3 {
    color: var(--slate-900);
    font-size: 1rem;
    margin-top: 1rem;
  }
  #result h3:first-child { margin-top: 0; }

  #result .section-thesis      h3 { color: var(--navy); }
  #result .section-bull         h3 { color: var(--green); }
  #result .section-bear         h3 { color: var(--red); }
  #result .section-risk         h3 { color: var(--amber); }
  #result .section-final        h3 { color: var(--accent); }

  .error-banner {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--red);
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }

  .cursor-blink::after {
    content: "▍";
    animation: blink 0.7s steps(1) infinite;
    color: var(--accent);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .empty-state {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--slate-400);
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .empty-state svg { margin-bottom: 0.75rem; opacity: 0.4; }

  @media (max-width: 600px) {
    header { padding: 1rem; }
    main { margin: 1rem auto; }
    .form-row { flex-direction: column; }
    .field-ticker { width: 100%; }
    button#submit { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
  <h1>Agentic Trader</h1>
  <span>Multi-Agent Financial Analysis</span>
</header>

<main>
  <div class="card">
    <form id="form" autocomplete="off">
      <div class="form-row">
        <div class="field field-ticker">
          <label for="ticker">Ticker</label>
          <input id="ticker" type="text" placeholder="AAPL" required maxlength="10">
        </div>
        <div class="field field-question">
          <label for="question">Question</label>
          <textarea id="question" placeholder="Should I buy this stock? What are the risks?" required></textarea>
        </div>
        <button id="submit" type="submit">Analyze</button>
      </div>
    </form>
  </div>

  <div class="agents-bar" id="agents-bar"></div>

  <div class="error-banner" id="error"></div>

  <div class="card" id="result-card">
    <div id="result"></div>
    <div class="empty-state" id="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <div>Enter a ticker and question above to get started.<br>The coordinator will delegate to specialist agents in real time.</div>
    </div>
  </div>
</main>

<script>
const AGENT_LABELS = {
  math_analyst: "Math Analyst",
  news_searcher: "News Searcher",
  price_analyst: "Price Analyst",
  economics_theorist: "Economics Theorist",
};

const form = document.getElementById("form");
const tickerInput = document.getElementById("ticker");
const questionInput = document.getElementById("question");
const submitBtn = document.getElementById("submit");
const agentsBar = document.getElementById("agents-bar");
const resultDiv = document.getElementById("result");
const emptyState = document.getElementById("empty-state");
const errorBanner = document.getElementById("error");

let controller = null;

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (controller) controller.abort();

  const ticker = tickerInput.value.trim().toUpperCase();
  const question = questionInput.value.trim();
  if (!ticker || !question) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "Analyzing…";
  agentsBar.innerHTML = "";
  resultDiv.textContent = "";
  resultDiv.style.display = "none";
  emptyState.style.display = "none";
  errorBanner.style.display = "none";

  const activeAgents = new Set();
  controller = new AbortController();

  try {
    const resp = await fetch("/analyze/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticker, question }),
      signal: controller.signal,
    });

    if (!resp.ok) {
      const detail = await resp.text();
      throw new Error(detail || `HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    resultDiv.style.display = "block";
    resultDiv.classList.add("cursor-blink");

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;

        let msg;
        try { msg = JSON.parse(raw); } catch { continue; }

        if (msg.type === "status") {
          const name = msg.agent;
          if (!activeAgents.has(name)) {
            activeAgents.add(name);
            const pill = document.createElement("span");
            pill.className = "agent-pill working";
            pill.id = "pill-" + name;
            pill.textContent = AGENT_LABELS[name] || name;
            agentsBar.appendChild(pill);
          }
        } else if (msg.type === "status_done") {
          const pill = document.getElementById("pill-" + msg.agent);
          if (pill) {
            pill.className = "agent-pill done";
          }
        } else if (msg.type === "token") {
          resultDiv.textContent += msg.content;
        } else if (msg.type === "error") {
          throw new Error(msg.message);
        } else if (msg.type === "done") {
          break;
        }
      }
    }

    resultDiv.classList.remove("cursor-blink");
    resultDiv.innerHTML = formatMarkdown(resultDiv.textContent);

    agentsBar.querySelectorAll(".agent-pill.working").forEach((pill) => {
      pill.className = "agent-pill done";
    });

  } catch (err) {
    if (err.name !== "AbortError") {
      errorBanner.textContent = "Error: " + err.message;
      errorBanner.style.display = "block";
      resultDiv.classList.remove("cursor-blink");
      if (!resultDiv.textContent) {
        resultDiv.style.display = "none";
        emptyState.style.display = "block";
      }
    }
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Analyze";
    controller = null;
  }
});

function formatMarkdown(text) {
  let html = escapeHtml(text);

  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");

  const sections = [
    { pattern: /(1\.\s*Thesis)/i, cls: "section-thesis" },
    { pattern: /(2\.\s*Bull [Cc]ase)/i, cls: "section-bull" },
    { pattern: /(3\.\s*Bear [Cc]ase)/i, cls: "section-bear" },
    { pattern: /(4\.\s*Risk [Ff]lags)/i, cls: "section-risk" },
    { pattern: /(5\.\s*Final [Vv]iew)/i, cls: "section-final" },
    { pattern: /(6\.\s*Disclaimer)/i, cls: "section-disclaimer" },
  ];
  for (const s of sections) {
    html = html.replace(s.pattern, `<h3 class="${s.cls}">$1</h3>`);
  }

  return html;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
